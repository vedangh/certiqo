{% extends "base.html" %}
{% block title %}Client - CertiQo{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ "Edit client" if client else "Add client" }}</h1>
  <form method="POST">
    <label>Name</label>
    <input type="text" name="name" value="{{ client.name if client else '' }}" required>
    <label>Email</label>
    <input type="email" name="email" value="{{ client.email or '' if client else '' }}">
    <label>Phone</label>
    <input type="text" name="phone" value="{{ client.phone or '' if client else '' }}">
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('clients') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
